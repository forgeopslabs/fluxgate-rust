[package]
name = "cli-sample"
description = "FluxGate Rust SDK sample: async client, flag snapshot and OpenFeature"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fluxgate = { path = "../../fluxgate", features = ["openfeature"] }
open-feature = "0.3"
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
